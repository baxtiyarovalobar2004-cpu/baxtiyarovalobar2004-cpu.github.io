// ===================== yordamchilar =====================
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const pop=(t)=>{t=clamp(t);return t<.6?ease(t/.6)*1.12:lerp(1.12,1,ease((t-.6)/.4))};
const sh=(hex,p)=>{const n=parseInt(hex.slice(1),16);const f=c=>Math.max(0,Math.min(255,Math.round(c*(1+p))));return"#"+[n>>16,(n>>8)&255,n&255].map(f).map(x=>x.toString(16).padStart(2,"0")).join("")};
let D=null; // timeline + envelope
window.init=d=>{D=d};
const env=(who,t)=>{const a=D.env[who];const i=Math.floor(t*30);return a[i]||0};

    <path d="M190 102 Q150 120 140 180 M204 102 Q248 120 258 180" stroke="${c.hairL}" stroke-width="3" fill="none" opacity=".7"/>`;
  }
  if(!front) return `<circle cx="200" cy="96" r="40" fill="${c.hair}"/><path d="M132 190 Q120 104 200 100 Q280 104 268 190Z" fill="${c.hair}"/>`;

}
function bigArm(c,side,shA,elA,prop){
  const x=side==="L"?116:284, y=330, dir=side==="L"?1:-1;
  const stripe=c.outfit==="stripe";
  const sleeve=stripe?`url(#st_${c.id})`:c.suit, sleeveD=stripe?c.stripe:sh(c.suit,-.25);
  const skin=c.skin, skinD=c.skinD;
  // yelka -> tirsak (ingichkalashgan yeng)
  const upper=`<path d="M-26 -6 Q-28 70 -21 150 L21 150 Q28 70 26 -6 Q0 -22 -26 -6Z" fill="${sleeve}" stroke="${sleeveD}" stroke-width="1.6"/>
    <path d="M${-12*dir} 20 Q${-16*dir} 80 ${-12*dir} 140" stroke="#00000018" stroke-width="8" fill="none"/>`;
  // bilak: shimarilgan yeng yoki kostyum yengi + oq manjet
  let fore, cuff="";
  if(stripe){
    fore=`<path d="M-19 0 Q-20 60 -14 112 L14 112 Q20 60 19 0Z" fill="${skin}"/><path d="M${8*dir} 14 Q${10*dir} 60 ${7*dir} 104" stroke="${skinD}" stroke-width="3" fill="none" opacity=".45"/>`;
    cuff=`<rect x="-24" y="-14" width="48" height="26" rx="11" fill="${c.shirt}" stroke="${c.stripe}" stroke-width="2"/><path d="M-22 -2 H22" stroke="${c.stripe}" stroke-width="1.5"/>`;
  } else {
    fore=`<path d="M-20 -6 Q-21 60 -16 100 L16 100 Q21 60 20 -6Z" fill="${c.suit}" stroke="${sleeveD}" stroke-width="1.6"/><rect x="-16" y="96" width="32" height="12" rx="4" fill="#fff"/>`;
  }
  const watch=(c.watch&&side==="L")?`<rect x="-17" y="92" width="34" height="13" rx="5" fill="#5a2e1a"/><circle cx="0" cy="98.5" r="7.5" fill="#c9a25a" stroke="#5a2e1a" stroke-width="2"/>`:"";
  // kaft + barmoqlar + bosh barmoq
  const hand=`<g transform="translate(0,112)">
    <path d="M-15 0 Q-18 18 -15 30 Q-12 44 -6 46 L6 46 Q14 44 16 30 Q18 16 15 0Z" fill="${skin}"/>
    <path d="M-9 30 V44 M-3 31 V47 M3 31 V47 M9 30 V43" stroke="${skinD}" stroke-width="1.6" opacity=".55"/>
    <path d="M${15*dir} 8 Q${27*dir} 14 ${26*dir} 26 Q${22*dir} 30 ${15*dir} 22Z" fill="${skin}" stroke="${skinD}" stroke-width="1" />
  </g>`;
  let p="";

    <g transform="translate(0,146) rotate(${elA})"><circle cx="0" cy="0" r="21" fill="${stripe?skin:c.suit}"/>${fore}${watch}${hand}${cuff}${p}</g></g>`;
}
function bigPerson(c,p){
  // p: armL[sh,el], armR[sh,el], mouth, blink, tilt, brow, smile, propL, propR
  const s=c.skin, m=clamp(p.mouth||0);
  let torso;
  if(c.outfit==="stripe"){
    torso=`<path d="M100 342 Q112 300 168 290 L200 300 L232 290 Q288 300 300 342 L308 660 L92 660Z" fill="url(#st_${c.id})"/>
    <path d="M182 294 L200 366 L218 294Z" fill="${c.skinD}"/>
    <path d="M170 288 L200 350 L188 362 L154 304Z" fill="${c.shirt}" stroke="${c.stripe}" stroke-width="2"/><path d="M230 288 L200 350 L212 362 L246 304Z" fill="${c.shirt}" stroke="${c.stripe}" stroke-width="2"/>
    <path d="M200 350 V660" stroke="${c.stripe}" stroke-width="2.5"/><circle cx="204" cy="400" r="4" fill="#dfe6f3"/><circle cx="204" cy="460" r="4" fill="#dfe6f3"/><circle cx="204" cy="520" r="4" fill="#dfe6f3"/>
    <path d="M226 400 h48 v52 q-24 8 -48 0Z" fill="url(#st_${c.id})" stroke="${c.stripe}" stroke-width="2"/><rect x="232" y="404" width="34" height="11" rx="2" fill="#c9a25a"/>`;
  } else {
    const d=sh(c.suit,-.3);
    torso=`<path d="M100 342 Q112 300 168 290 L200 300 L232 290 Q288 300 300 342 L308 660 L92 660Z" fill="${c.suit}"/>
    <path d="M178 292 L200 380 L222 292Z" fill="#fff"/><path d="M168 290 L200 392 L160 350 L150 306Z" fill="${d}"/><path d="M232 290 L200 392 L240 350 L250 306Z" fill="${d}"/>
    <circle cx="200" cy="440" r="6" fill="${d}"/><circle cx="200" cy="500" r="6" fill="${d}"/><rect x="238" y="350" width="26" height="8" rx="3" fill="#ffc93c"/>`;
  }
  const eyeY=187, bl=p.blink;
  const eye=(cx,ir)=>bl?`<path d="M${cx-11} ${eyeY+1} q11 6 22 0" stroke="#1d120b" stroke-width="3" fill="none" stroke-linecap="round"/>`:
    `<ellipse cx="${cx}" cy="${eyeY}" rx="10.5" ry="7.5" fill="#fff"/><circle cx="${cx+ir}" cy="${eyeY}" r="6.2" fill="#7a5a3a"/><circle cx="${cx+ir}" cy="${eyeY}" r="3.1" fill="#1d120b"/><circle cx="${cx+ir+2}" cy="${eyeY-2}" r="1.8" fill="#fff"/><path d="M${cx-11} ${eyeY-2} q11 -8 22 0" stroke="#1d120b" stroke-width="2.4" fill="none"/>`;
  const by=-(p.brow||0)*8, ag=(p.angry||0);
  const brows=`<g transform="translate(0,${by+ag*4})"><path transform="rotate(${ag*16} 178 160)" d="M162 160 q18 -7 32 -2" stroke="${c.hair}" stroke-width="${5+ag*1.5}" fill="none" stroke-linecap="round"/><path transform="rotate(${-ag*16} 222 160)" d="M206 158 q16 -5 32 2" stroke="${c.hair}" stroke-width="${5+ag*1.5}" fill="none" stroke-linecap="round"/></g>`;
  const red=`<ellipse cx="200" cy="205" rx="60" ry="70" fill="#ff3b3b" opacity="${(p.red||0)*.28}"/>`;
  const glasses=c.glasses?`<g fill="#ffffff12" stroke="#5a2f1a" stroke-width="4.2"><rect x="151" y="168" width="48" height="38" rx="15"/><rect x="201" y="168" width="48" height="38" rx="15"/></g><path d="M196 182 h8" stroke="#5a2f1a" stroke-width="4"/>`:"";
  const mouth=m>0.07?`<ellipse cx="200" cy="244" rx="${11+5*m}" ry="${2.5+11*m}" fill="#5a1f22"/><path d="M${189-5*m} ${241-4*m} q${11+5*m} -4 ${22+10*m} 0" stroke="#b8706b" stroke-width="3.5" fill="none"/><rect x="${193}" y="${241-5*m}" width="14" height="${3+2*m}" rx="1" fill="#fff" opacity="${m>.3?.9:0}"/>`
    :(p.smile?`<path d="M182 238 Q200 256 218 238 Q200 248 182 238Z" fill="#b8706b"/>`:`<path d="M184 240 q8 -4 16 -1 q8 -3 16 1 q-16 5 -32 0Z" fill="#b8706b"/><path d="M186 241 q14 8 28 0 q-14 3 -28 0Z" fill="#c98581"/>`);
  const head=`<g transform="rotate(${p.tilt||0} 200 290)">${bigHair(c,false)}<rect x="182" y="244" width="36" height="62" fill="${c.skinD}"/>
    <ellipse cx="200" cy="192" rx="62" ry="76" fill="${s}"/>${red}${brows}${eye(176,1)}${eye(224,-1)}${glasses}
    <path d="M201 200 q-4 16 -3 24 q5 3 10 0" stroke="${c.skinD}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="160" cy="222" rx="13" ry="7" fill="#ff8d8d" opacity=".2"/><ellipse cx="240" cy="222" rx="13" ry="7" fill="#ff8d8d" opacity=".2"/>${mouth}${bigHair(c,true)}</g>`;
  return `<defs><pattern id="st_${c.id}" width="9" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" fill="${c.shirt||"#fff"}"/><rect width="1.6" height="10" fill="${c.stripe||"#fff"}"/></pattern></defs>
    ${torso}${head}${bigArm(c,"L",p.armL[0],p.armL[1],p.propL)}${bigArm(c,"R",p.armR[0],p.armR[1],p.propR)}`;
}

  else if(type==="video"){s=`<rect x="8" y="8" width="134" height="44" fill="#6d597a"/><rect x="8" y="60" width="134" height="9" fill="#e9c46a"/><rect x="8" y="74" width="100" height="7" fill="#2a9d8f"/><rect x="${8+(t*40)%130}" y="56" width="3" height="32" fill="#e63946"/>`}

function station(x,y,key,state,t,k=2.5,on=true){
  // x,y = desk top centre ; state: work|sleep|hand|happy|idle
  const L=AG[key]; const ph=(x*7+y*3)%10;
  let p={l:0,r:0,eyes:"o",mouth:"n",legs:false};
  if(state==="work"){p.l=-18-6*Math.sin(t*22+ph);p.r=18+6*Math.sin(t*25+ph);p.head={y:0,rot:-3*Math.sin(t*2+ph)}}
  if(state==="sleep"){p.l=-78;p.r=78;p.eyes="c";p.mouth="o";p.head={y:8+Math.sin(t*2)*.6,rot:-16}}
  if(state==="hand"){p.r=-168+6*Math.sin(t*6);p.l=-20;p.mouth="n";p.head={y:0,rot:4*Math.sin(t*3)}}
  if(state==="happy"){p.r=-150+10*Math.sin(t*10);p.l=-20;p.mouth="h";p.head={y:0,rot:5*Math.sin(t*8)}}
  if(state==="tired"){p.l=-18-3*Math.sin(t*9);p.r=18;p.mouth="t";p.head={y:2,rot:-6}}
  const screenOn=on&&(state==="work"||state==="tired");
  let z="";
  if(state==="sleep"){for(let i=0;i<3;i++){const u=((t*.6+i/3)%1);z+=`<text x="${x+40+u*60}" y="${y-170-u*120}" font-size="${40+u*30}" font-weight="900" fill="#c9c2ff" opacity="${Math.sin(u*Math.PI)}">z</text>`}}
  const tag=`<g transform="translate(${x+45},${y-238})"><rect x="-120" y="-34" width="240" height="64" rx="16" fill="#1f1b2cdd"/><text x="0" y="-6" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">${L.name}</text><text x="0" y="22" text-anchor="middle" font-size="20" font-weight="700" fill="#ffc93c">${L.role}</text></g>`;
  return `<g>
   <rect x="${x-20}" y="${y-110}" width="110" height="112" rx="26" fill="#3a3550"/>
   <g transform="translate(${x+45-22*k},${y-150}) scale(${k})">${agentSVG(L,p)}</g>
   <rect x="${x-130}" y="${y}" width="290" height="22" rx="8" fill="#c08d63"/><rect x="${x-120}" y="${y+20}" width="270" height="90" rx="6" fill="#8d5f3e"/>
   <g transform="translate(${x-128},${y-112})"><rect x="-6" y="-6" width="162" height="108" rx="8" fill="#16161c"/><rect width="150" height="96" fill="${screenOn?"#0d1117":"#05060a"}"/>${screenOn?screen(L.screen,t):""}<rect x="66" y="102" width="18" height="16" fill="#2c2c33"/></g>
   <rect x="${x+10}" y="${y+4}" width="70" height="10" rx="3" fill="#eee"/>
   ${z}${tag}</g>`;
}

const POSE={
  idle:{armL:[12,-22],armR:[-12,22]},
  up:{armL:[163,-22],armR:[-163,22]},
  open:{armL:[55,-35],armR:[-55,35]},
  chin:{armL:[12,-22],armR:[18,152]},
  pointR:{armL:[12,-22],armR:[-22,-108]},
  pointL:{armL:[22,108],armR:[-12,22]},
  thumb:{armL:[12,-22],armR:[-40,-110]},
  explainA:{armL:[30,-80],armR:[-14,30]},
  explainB:{armL:[12,-22],armR:[-30,80]},
  shrug:{armL:[48,-95],armR:[-48,95]},
  type:{armL:[12,-74],armR:[-12,74]},
  lean:{armL:[30,-120],armR:[-30,120]},
  clip:{armL:[20,-110],armR:[-12,22]},
};
const mixPose=(a,b,u)=>({armL:[lerp(a.armL[0],b.armL[0],u),lerp(a.armL[1],b.armL[1],u)],armR:[lerp(a.armR[0],b.armR[0],u),lerp(a.armR[1],b.armR[1],u)]});
let SHOT_DUR=3, SPEAK=0;
function seqPose(seq,u,t){ // seq: [[pose,at],...] at in 0..1 of shot
  let cur=POSE[seq[0][0]];
  for(let i=1;i<seq.length;i++){const [n,at]=seq[i];const k=ease((u-at)*SHOT_DUR/.38);if(k>0)cur=mixPose(cur,POSE[n],k)}
  const w=Math.sin(t*2.3)*2.2, g=SPEAK*7*Math.sin(t*7.5);
  return {armL:[cur.armL[0]+w,cur.armL[1]-g*.6],armR:[cur.armR[0]-w,cur.armR[1]+g]};
}
const blinkAt=t=>((t*1000)%3700)<120;

function cube(p,t){ // p: mouth, wink, smirk, blank, wave, popS, bob, laugh
  const m=clamp(p.mouth||0), bl=blinkAt(t+2.1)&&!p.wink;
  const eyeL=(p.wink)?`<path d="M126 228 q13 -10 26 0" stroke="#1b1310" stroke-width="7" fill="none" stroke-linecap="round"/>`:bl?`<rect x="128" y="222" width="22" height="6" rx="3" fill="#1b1310"/>`:`<rect x="128" y="200" width="22" height="48" rx="3" fill="#1b1310"/><rect x="131" y="204" width="7" height="10" fill="#fff" opacity=".8"/>`;
  const eyeR=bl?`<rect x="200" y="222" width="22" height="6" rx="3" fill="#1b1310"/>`:`<rect x="200" y="${p.smirk?206:200}" width="22" height="${p.smirk?40:48}" rx="3" fill="#1b1310"/><rect x="203" y="${p.smirk?210:204}" width="7" height="10" fill="#fff" opacity=".8"/>`;
  let mouth;
  if(p.blank) mouth=`<path d="M164 288 h32" stroke="#1b1310" stroke-width="6" stroke-linecap="round"/>`;
  else if(p.smirk) mouth=`<path d="M156 284 q30 16 56 -10" stroke="#1b1310" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M206 276 l10 -6" stroke="#1b1310" stroke-width="5" stroke-linecap="round"/>`;
  else if(m>.07) mouth=`<ellipse cx="180" cy="288" rx="${12+8*m}" ry="${3+14*m}" fill="#3a1410"/>`;
  else mouth=`<path d="M160 285 q20 14 40 0" stroke="#1b1310" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const wv=p.wave||0, lg=p.laugh?Math.sin(t*22)*4:0;
  const sweat=p.blank?`<path d="M262 170 q10 16 0 22 q-10 -6 0 -22z" fill="#8fd3ff"/>`:"";
  return `<g transform="translate(0,${(p.bob||0)+lg})">
   <ellipse cx="190" cy="400" rx="120" ry="16" fill="#000" opacity=".35"/>
   <rect x="120" y="330" width="34" height="62" fill="#c7623f"/><rect x="226" y="330" width="34" height="62" fill="#c7623f"/>
   <rect x="150" y="330" width="26" height="56" fill="#b0563a"/><rect x="250" y="330" width="26" height="56" fill="#b0563a"/>
   <path d="M86 150 L116 120 H306 L306 310 L276 340 Z" fill="#b85f43"/><path d="M86 150 L116 120 H306 L276 150 Z" fill="#f0a27a"/>
   <rect x="86" y="150" width="190" height="190" fill="#d97757"/>
   <g transform="rotate(${-wv} 276 222)"><rect x="276" y="200" width="40" height="44" fill="#e8946f"/></g>
   <rect x="46" y="200" width="40" height="44" fill="#c7623f"/>
   ${eyeL}${eyeR}${mouth}${sweat}
   <ellipse cx="114" cy="270" rx="14" ry="8" fill="#ff8f8f" opacity=".4"/><ellipse cx="246" cy="270" rx="14" ry="8" fill="#ff8f8f" opacity=".4"/></g>`;
}

  let svg="", html="", over="";
  const zoom=1+.05*u;
  const wrap=(inner)=>`<g transform="translate(540,960) scale(${zoom}) translate(-540,-960)">${inner}</g>`;
  const lob=(seq,extra={},y=520)=>(SPEAK=mL,personAt(LOBAR,{...seqPose(seq,u,t),mouth:mL,blink:blinkAt(t),tilt:2*Math.sin(t*1.7),...extra},170,y,1.85));
